# main.py E402s are load-bearing startup ordering: console suppression
# must precede any child-process creation; heavy Qt imports are deferred
# past the splash to minimize cold-start blank time (see inline comments).
# pdf-master — Ruff S1 baseline (E4,E7,E9,F).
# S3 (B) / S4 (UP) intentionally deferred.
# S2 (I) promoted: import sorting via ruff I --fix.
# S3 (B) promoted: safe subset fixed (B007 renames, B010 setattr->assign
# after seam audit); B023/B905 deferred per no-functional-change policy
# (see evidence/pdf-master/stage-S3-verification.md).
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.per-file-ignores]
"main.py" = ["E402"]
# B023 deferred: owner_function is defined per-iteration inside the
# TARGET_WORKER_FILES loop but always called synchronously within the same
# iteration (parent rebound each iteration) -- no late-binding defect in
# practice; rebinding via default arg would edit test semantics.
"tests/test_i18n_worker_hardcoded_smoke.py" = ["B023"]
# UP031 deferred: printf-formatting inside a multi-line QSS template
# (file_selector) and a codegen snippet (test); .format conversion is
# churn without benefit, and an inline noqa on the opening-quote line
# would land inside the string literal.
"src/ui/common_widgets/file_selector.py" = ["UP031"]
"tests/test_startup_single_instance.py" = ["UP031"]
