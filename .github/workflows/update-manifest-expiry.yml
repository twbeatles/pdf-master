name: Update manifest expiry watch

# PROJECT_AUDIT.md Phase 1.3 — 365-day manifest expiry must not silently lapse.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NOTE: check_update_manifest_expiry.py is stdlib-only by design —
      # do not add a pip-install step here. A third-party import fails the
      # scheduled run (see 2026-09-28 cryptography ModuleNotFoundError).
      - name: Check manifest expiry
        run: python scripts/check_update_manifest_expiry.py --warn-days 30
