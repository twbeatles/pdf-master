name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-contracts:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[build,dev,secure]

      - name: Theme contrast gate
        run: python scripts/check_theme_contrast.py

      - name: Theme regression tests
        run: python -m pytest tests/test_fluent_shell_boundary.py tests/test_theme_auto_follow.py tests/test_fluent_design_foundation.py -q

      - name: App smoke
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python main.py --smoke
