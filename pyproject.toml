[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-master"
dynamic = ["version"]
description = "Desktop PDF utility built with PyQt6 and PyMuPDF."
readme = "README_EN.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{ name = "PDF Master" }]
dependencies = [
  "PyQt6>=6.11",
  "PyQt6-Fluent-Widgets>=1.11.3,<2",
  "darkdetect>=0.8,<1",
  "PyMuPDF>=1.28",
  "cryptography>=50.0",
]

[project.optional-dependencies]
ai = [
  "google-genai>=2.30.1",
]
# OCR: 시스템 Tesseract 바이너리 + (선택) PyMuPDF OCR 경로. 별도 Python 패키지는 필수가 아님.
ocr = []
build = [
  "build>=1.6.1",
  "PyInstaller>=6.22",
]
dev = [
  "pytest>=9.1",
  "pytest-qt>=4.5",
  "pytest-timeout>=2.4",
  "pyright>=1.1.414",
]
secure = [
  "keyring>=25.7",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "src.core._constants_impl.values.VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
